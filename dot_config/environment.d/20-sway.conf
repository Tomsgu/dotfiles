# Desktop session
XDG_CURRENT_DESKTOP=sway
EDITOR=nvim

# Cursor
XCURSOR_THEME=capitaine-cursors-light
XCURSOR_SIZE=24

# Wayland backends for toolkits that do not pick it by default
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland

# Java apps show blank windows under wlroots without this
_JAVA_AWT_WM_NONREPARENTING=1
